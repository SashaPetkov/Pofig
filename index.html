<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Видеочат</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #333;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --text: #eaeaea;
      --muted: #888;
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
    }

    h1 { margin: 0 0 16px; font-size: 22px; }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: var(--primary); }

    button {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: var(--danger-hover); }

    #status {
      margin-bottom: 16px;
      font-size: 14px;
      color: #60a5fa;
      text-align: center;
    }

    .user-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .user-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 220px;
      overflow-y: auto;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: #262626;
      margin-bottom: 8px;
    }
    .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }
    .status-dot.online { background: #22c55e; }
    .user-item button {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 800px;
    }
    .video-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-card span { margin-bottom: 8px; font-size: 14px; color: var(--muted); }
    video {
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 8px;
      object-fit: cover;
    }

    .call-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      max-width: 800px;
    }

    .incoming-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-card h3 { margin-top: 0; }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .hidden { display: none !important; }
  </style>

  <!-- Firebase SDKs (v8) & PeerJS -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <h1>P2P Видеочат</h1>
  <div id="status">Инициализация...</div>

  <!-- Экран авторизации -->
  <div class="card" id="auth-box">
    <h3 style="margin-top:0;">Вход / Регистрация</h3>
    <input type="text" id="username" placeholder="Имя пользователя (логин)">
    <input type="password" id="password" placeholder="Пароль">
    <button id="auth-btn">Войти / Зарегистрироваться</button>
  </div>

  <!-- Панель контактов -->
  <div class="card hidden" id="contacts-box">
    <div class="user-list-header">
      <span id="current-user-label" style="font-weight: 600; color: #fff;"></span>
      <button id="logout-btn" style="width: auto; padding: 4px 10px; font-size: 12px;" class="danger">Выйти</button>
    </div>
    <input type="text" id="search-input" placeholder="Поиск контактов...">
    <ul class="user-list" id="users-list"></ul>
  </div>

  <!-- Сетка видео -->
  <div class="video-grid">
    <div class="video-card">
      <span>Вы</span>
      <video id="local-video" autoplay muted playsinline></video>
    </div>
    <div class="video-card">
      <span id="remote-label">Собеседник</span>
      <video id="remote-video" autoplay playsinline></video>
    </div>
  </div>

  <div class="call-actions hidden" id="call-controls">
    <button id="hangup-btn" class="danger">Завершить звонок</button>
  </div>

  <!-- Модальное окно входящего звонка -->
  <div class="incoming-modal hidden" id="incoming-modal">
    <div class="modal-card">
      <h3>Входящий звонок</h3>
      <p id="caller-name">Пользователь звонит вам...</p>
      <div class="modal-actions">
        <button id="accept-call-btn" style="background:#22c55e;">Принять</button>
        <button id="reject-call-btn" class="danger">Отклонить</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
